
name: Build 369 Manifestation Tracker APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          unzip 369-Manifestation-Tracker-Android-Project.zip -d project
          find project -name settings.gradle.kts -print

      - name: Build debug APK
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle.kts -print -quit)")
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 369-Manifestation-Tracker-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
